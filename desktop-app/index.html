<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ScholarShield - Focus Mode</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      background: #1e293b;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }
    h1 { margin-bottom: 8px; color: #38bdf8; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    input {
      width: 80%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      text-align: center;
      margin-bottom: 16px;
    }
    button {
      width: 88%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0369a1; }
    .error { color: #f87171; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ScholarShield Focus Mode</h1>
    <p>Distraction-free learning environment active.</p>

    <input type="password" id="pinInput" placeholder="Enter Parent PIN to Exit" maxlength="4" />
    <button onclick="unlockApp()">Unlock & Exit</button>
    <div id="errorMsg" class="error"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    function unlockApp() {
      const pin = document.getElementById('pinInput').value;
      if (!pin) {
        document.getElementById('errorMsg').innerText = "Please enter PIN";
        return;
      }
      ipcRenderer.send('unlock-kiosk', pin);
    }

    ipcRenderer.on('pin-verification-result', (event, response) => {
      if (!response.success) {
        document.getElementById('errorMsg').innerText = response.message;
      }
    });
  </script>
</body>
</html>
